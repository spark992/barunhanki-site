backend:
  name: github
  repo: spark992/barunhanki-site
  branch: main

locale: ko
media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "site"
    label: "홈페이지 관리"
    files:
      - name: "settings"
        label: "기본정보 · 식단표"
        file: "content/settings.json"
        format: "json"
        fields:
          - {label: "상호", name: "brand", widget: "string"}
          - {label: "가격", name: "price", widget: "string"}
          - {label: "전화번호", name: "phone", widget: "string"}
          - {label: "카카오톡 ID", name: "kakao", widget: "string"}
          - {label: "배달 안내", name: "delivery", widget: "text"}
          - {label: "주문 안내", name: "order", widget: "string"}
          - {label: "수량 변경 마감", name: "change_deadline", widget: "string"}
          - {label: "식단표 제목", name: "meal_plan_title", widget: "string"}
          - {label: "식단표 이미지", name: "meal_plan_image", widget: "image", required: false}
          - {label: "안내문구", name: "notice", widget: "text"}

  - name: "notices"
    label: "공지사항"
    folder: "content/notices"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "제목", name: "title", widget: "string"}
      - {label: "작성일", name: "date", widget: "datetime"}
      - {label: "내용", name: "body", widget: "markdown"}

  - name: "photos"
    label: "도시락 사진"
    folder: "content/photos"
    create: true
    extension: "json"
    format: "json"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "사진 제목", name: "title", widget: "string"}
      - {label: "사진", name: "image", widget: "image"}
      - {label: "설명", name: "description", widget: "text", required: false}
